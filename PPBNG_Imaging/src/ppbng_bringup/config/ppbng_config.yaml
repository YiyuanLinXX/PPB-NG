# PPB-NG single user configuration file
#
# Restart the launch after editing this file; no ROS 2 package rebuild is required.
# Never store NTRIP passwords or other secrets here.
schema_version: 1
machine_id: "PPBNG-WINDOWS-IPC"

safety:
  # Production launch still requires an explicit hardware_enabled:=true argument.
  configured: true
  hardware_enabled: true
  allow_device_reset: false
  allow_network_reconfiguration: false
  allow_firmware_update: false

session:
  # This machine's 2 TB SSD is C:. Another existing directory on that SSD may be used.
  output_root: "C:/Users/cairlab/Desktop/Projects/PPB_NG_2026/ppbng_ros2_ws/data"
  planned_duration_seconds: 7200
  minimum_reserve_bytes: 107374182400
  capacity_headroom_basis_points: 2500
  disk_check_interval_ms: 1000
  # Measured on this machine's C: NTFS volume on 2026-09-01 using write-through
  # plus FlushFileBuffers: 969.07 MiB/s over 8 GiB. Launch checks the evidence volume.
  throughput_evidence_path: "C:/Users/cairlab/Desktop/Projects/PPB_NG_2026/ppbng_ros2_ws/data/ppbng_durable_evidence_311c41ad-c3e3-4a15-9437-3f53e220ad33.json"
  maximum_segment_bytes: 8589934592
  checkpoint_interval_frames: 30
  # Both HSI cameras capture initial dark references only. The Spectralon bar stays in view; FFC is offline.
  hsi_dark_duration_seconds: 5.0
  # Throughput-first HSI recording: keep timestamps/index/sequence checks.
  # 0 updates headers/checkpoints only at part boundaries and orderly close.
  # With 0, HSI header/checkpoint atomic replacement is buffered (no forced SSD flush).
  # Abrupt termination may leave the active part header stale; use an ordered stop.
  hsi_flush_every_lines: 0
  # Optional extra application-level pixel checksum (not the transport checksum).
  # false avoids scanning every payload again; stored-pixel corruption is not CRC-detectable.
  hsi_payload_crc_enabled: false

runtime:
  # Headless FX10e SDK initialization measured about 9 s. Allow sufficient start-batch time
  # to avoid treating a normally initializing node as disconnected and invoking fault cleanup.
  # A named mutex serializes dual-HSI initialization; 60 s covers both cold starts.
  # This is not a 60 s acquisition data-gap allowance; the acquisition watchdog remains 0.5 s.
  batch_timeout_ms: 60000

time_authority:
  pps_required: false
  pps_gnss_evidence_confirmed: false
  maximum_host_skew_ns: 250000000
  trigger_wait_timeout_ns: 500000000
  unverified_uncertainty_ns: 250000000
  confirmed_uncertainty_ns: 1000000
  expected_system_offset_ns: 0

rgb:
  enabled: true
  expected_model: "BFS-U3-122S6C-C"
  expected_serial: "22209867"
  acquisition:
    width: 4096
    height: 3000
    row_stride_bytes: 4096
    payload_bytes: 12288000
    pixel_format: "BayerRG8"
    trigger_source: "Line0"
    trigger_activation: "RisingEdge"
    # Select fixed or automatic settings for vineyard tests. Chunk Data records actual per-frame values.
    exposure_auto: "Continuous"
    gain_auto: "Continuous"
    balance_white_auto: "Once"
    balance_white_auto_profile: "Outdoor"
    auto_exposure_control_priority: "Gain"
    auto_exposure_time_upper_limit_us: 5000.0
    auto_exposure_gain_upper_limit_db: 12.0
    chunk_data_enabled: true
    # Allow peer initialization + UNO first-pulse delay, without accumulating
    # disconnect timeouts before the first trigger/frame. The wait is bounded.
    # Once a trigger/frame arrives, the original runtime timeout policy applies.
    startup_trigger_wait_ms: 65000
    acquisition_timeout_ms: 1000
    association_capacity: 256
    association_max_wait_ms: 500
    association_evidence_confirmed: false
    consecutive_timeout_threshold: 3
    recovery_maximum_attempts: 5
    recovery_initial_backoff_ms: 250
    recovery_maximum_backoff_ms: 4000

thermal:
  enabled: true
  expected_model: "A6701"
  expected_device_id: "00111C0408CD"
  expected_ip: "192.168.20.2"
  motion_interlock:
    # Fail-safe permission for the navigation Pi: true only for fresh, valid A6701 status outside NUC.
    input_topic: "/thermal/nuc_state"
    output_topic: "/ppbng/safety/thermal_motion_permitted"
    state_timeout_ms: 1250
    publish_period_ms: 100
    # Production additionally requires RECORDING, all sensor streams advancing,
    # and a fresh manager heartbeat. Faults/stale streams latch FALSE until a new session.
    # Same Pi topic, same Bool and QoS; normal NUC remains a temporary inhibit.
    health_timeout_ms: 3000
  acquisition:
    transport_width: 640
    transport_height: 513
    image_width: 640
    image_height: 512
    payload_bytes: 656640
    pixel_format: "Mono16"
    ir_format: "Radiometric"
    frame_sync_source: "External"
    frame_sync_mode: "Integration"
    frame_sync_polarity: "ActiveHigh"
    # August 2026 UNO R4 hardware-trigger soak tests confirmed Integration/ActiveHigh.
    frame_sync_evidence_confirmed: true
    # At production startup, read and save factory calibration, temperature/count ranges, lens/filter,
    # Planck/polynomial coefficients, and object/environment parameters. Missing critical fields block acquisition.
    require_complete_calibration_metadata: true
    # Same startup-only trigger wait as RGB; NUC safety behavior is unchanged.
    startup_trigger_wait_ms: 65000
    acquisition_timeout_ms: 1000
    association_capacity: 256
    association_max_wait_ms: 500
    association_evidence_confirmed: false
    consecutive_timeout_threshold: 3
    recovery_maximum_attempts: 5
    recovery_initial_backoff_ms: 250
    recovery_maximum_backoff_ms: 4000

hsi:
  enabled: true
  # Operator stress-test update: native binning, FX10e 120 Hz; SWIR unchanged.
  # Intended speed remains 0.2 m/s, nominal canopy distance 0.70 m.
  # This file does NOT command robot speed; set speed on the navigation Raspberry Pi.
  # FX10e: ~0.471 mm cross-track / 1.667 mm along-track sampling (not square).
  # SWIR: ~1.115 mm cross-track / 2.222 mm along-track sampling; keep native data.
  # New binning/rates require a short stationary and moving-target check before production.
  # See docs/HSI_FIELD_SETTINGS_20260922.md for evidence, limits and fallback settings.
  specsensor_sdk_root: "C:/Program Files (x86)/Specim/SDKs/SpecSensor/2020_519"
  license_path: ""
  # SDK Initialize is bounded. Increase only after investigating a repeatable
  # slow-start cause; a GUI selection dialog must never be used as a workaround.
  initialization_timeout_ms: 5000
  # IMPORTANT: camera readout timing constrains line_rate_hz and exposure_us; combinations are not arbitrary.
  # clamp_exposure keeps the requested FPS and clamps exposure to live SDK limits after binning/FPS.
  # Unsupported FPS, invalid input, or unexpected readback still blocks acquisition; no silent FPS reduction.
  # strict restores legacy behavior. Neither policy guesses limits from FPS alone.
  # Changes are logged, not written back to this YAML. Restart acquisition after editing.
  fx10e:
    enabled: true
    device_index: 3
    expected_profile_name: "FX10e with Pleora"
    expected_identity: "3210441"
    calibration_pack_path: "C:/Users/cairlab/Documents/Applications/HyperFusion/calibration/fx10e/3210441_20211027_calpack.scp"
    # Never use ui: it opens eBUS Device Selection and can wait indefinitely in an SSH session.
    grabber_channel: "192.168.10.2"
    pleora_packet_size: 8228
    trigger_mode: "Internal"
    spatial_samples: 1024
    spectral_bands: 448
    line_rate_hz: 120.0
    # The previous 9800 us request is retained, but exceeds the 8333 us line period.
    # clamp_exposure reduces it to live SDK limits; saved actual readback is authoritative.
    exposure_us: 4500.0
    timing_policy: "clamp_exposure"
    # Explicit native SDK factors (1x spatial and 1x spectral), not enum indices.
    # 1024 spatial samples and 448 bands match this camera's spectral/wlcal1b.wls.
    # Keep the full calibrated wavelength range; do not change ROI to match these dimensions.
    # 0 preserves the initialized SDK profile; explicit choices: 1, 2, 4, 8.
    # Support depends on the camera. Set expected spatial_samples/spectral_bands to the resulting
    # SDK geometry as well; startup rejects a mismatch instead of guessing or mislabeling ENVI data.
    spatial_binning: 1
    spectral_binning: 1
    # D10 showed callback overflow with 128 lines (about 2.56 s) during 8 GiB part rollover/flush.
    # At 1024x448 and 120 Hz, 512 lines provide 4.27 s and consume about 448 MiB.
    callback_queue_capacity: 512
    pending_trigger_capacity: 512
    trigger_match_timeout_ms: 500
    # The first frame after Initialize/Acquisition.Start can take longer than the normal 8.33 ms interval.
    internal_first_frame_timeout_ms: 10000
    # On a moving robot, reconnects must not masquerade as continuous data. The first sample continuity fault
    # stops the stream, closes the shutter, saves diagnostics, and awaits safe stop; no repeated reconnect loop.
    fail_fast_on_sample_fault: true
    association_evidence_confirmed: false
    recovery:
      recovery_max_attempts: 5
      recovery_initial_backoff_ms: 250
      recovery_max_backoff_ms: 4000
      recovery_consecutive_frame_timeouts: 3
  swir:
    enabled: true
    device_index: 8
    expected_profile_name: "SWIR3 with NI"
    expected_identity: "462111"
    calibration_pack_path: "C:/Users/cairlab/Documents/Applications/HyperFusion/calibration/swir/462111_OLES15_20250109_calpack.scp"
    ni_grabber_channel: "img0"
    ni_camera_file_path: "C:/Program Files (x86)/Specim/SDKs/SpecSensor/2020_519/external/NI/Specim_SWIR3.icd"
    ni_camera_serial_port: ""
    trigger_mode: "Internal"
    spatial_samples: 384
    spectral_bands: 288
    # The installed SWIR3 profile specifies 2.2 ms readout. At 90 Hz the provisional
    # exposure ceiling is 1000/90 - 2.2 = 8.911 ms, so start at 8 ms, not 9 ms.
    # Live SDK bounds remain authoritative. At 80 Hz, 10 ms has ~0.3 ms margin.
    line_rate_hz: 90.0
    exposure_us: 8910.0
    timing_policy: "clamp_exposure"
    # Keep native 384x288 data and the supplied 1x calibration. Optional cross-track
    # pair averaging is offline, not an assumed hardware binning or timing benefit.
    spatial_binning: 1
    spectral_binning: 1
    # Preserve roughly the old six-second queue horizon after increasing 20.59 -> 90 Hz.
    # 512 lines provide 5.69 s and consume about 108 MiB; pending capacity must match.
    callback_queue_capacity: 512
    pending_trigger_capacity: 512
    trigger_match_timeout_ms: 500
    internal_first_frame_timeout_ms: 10000
    fail_fast_on_sample_fault: true
    association_evidence_confirmed: false
    recovery:
      recovery_max_attempts: 5
      recovery_initial_backoff_ms: 250
      recovery_max_backoff_ms: 4000
      recovery_consecutive_frame_timeouts: 3

timing:
  enabled: true
  # The robot uses bench-validated UNO R4 ASCII firmware (START/STOP/STATUS/KEEPALIVE).
  # protocol_v1 is the future PPS-capable protocol. Do not switch before firmware completion and validation.
  backend: "uno_r4_ascii"
  pps_required: false
  port: "COM9"
  baud_rate: 115200
  trusted_usb_identity_mapping: false
  usb_vid: 0
  usb_pid: 0
  usb_serial: "F412FA75EC94"
  schedule_id: 1
  ticks_per_second: 1000000
  channels:
    # HSI uses internal continuous line timing and does not occupy external-trigger channels.
    fx10e: {enabled: false, rate_numerator_hz: 1, rate_denominator: 1, pulse_width_ticks: 100, phase_ticks: 0}
    swir: {enabled: false, rate_numerator_hz: 1, rate_denominator: 1, pulse_width_ticks: 100, phase_ticks: 0}
    # Validated firmware is fixed at 2 Hz and 1 ms; at a 1 MHz tick clock, 1 ms = 1000 ticks.
    # Rate/pulse-width changes require matching, revalidated Arduino firmware; launch rejects inconsistent values.
    rgb: {enabled: true, rate_numerator_hz: 2, rate_denominator: 1, pulse_width_ticks: 1000, phase_ticks: 0}
    thermal: {enabled: true, rate_numerator_hz: 2, rate_denominator: 1, pulse_width_ticks: 1000, phase_ticks: 0}

gnss:
  # UM982 TXD connects through a dedicated receive-only FTDI TTL-to-USB adapter; no configuration or RTCM is sent.
  # Verified 2026-09-17: FTDI VID/PID 0403:6001, serial ABB8YIIZA, currently COM13.
  # Windows normally retains COM assignment by USB serial. Reconfirm the port when replacing the adapter.
  enabled: true
  port: "COM13"
  usb_vid: "0403"
  usb_pid: "6001"
  usb_serial: "ABB8YIIZA"
  baud_rate: 115200
  receive_only: true
  storage_stem: "um982"
  flush_every_sentences: 10
  recovery:
    recovery_max_attempts: 5
    recovery_initial_backoff_ms: 250
    recovery_max_backoff_ms: 4000
    recovery_consecutive_receive_timeouts: 200

rsm400:
  enabled: true
  port: "COM10"
  usb_vid: "0403"
  usb_pid: "6015"
  usb_serial: "DA87MNV7A"  # FTDI identity confirmed on 2026-09-02; use this if COM numbering changes
  baud_rate: 115200
  telemetry_hz: 2.0
  allow_observation_commands: true  # GAT/MST telemetry subscriptions only; motion control is disabled.
  observe_only_on_launch: true
  allow_control: false
  require_ready_telemetry: true
  stab_major_status_confirmed: true
  expected_stab_major_status: 4  # ICD 5.6.1: second MS digit; 4 = STAB.
  maximum_ready_error_level: 0
  ready_timeout_ms: 2000
  storage_stem: "rsm400"
  flush_every_records: 10
  features_confirmed: false
  of002_available: false
  of005_available: false

future_devices: {}
  # Add future device parameters here or in a new top-level section, not another user configuration file.
